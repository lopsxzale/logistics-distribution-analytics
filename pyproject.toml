[project]
name = "logistics-distribution-analytics"
version = "1.0.0"
description = "Análise de preços de combustíveis da ANP sob a ótica de uma operação de distribuição"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # comprimento de linha é responsabilidade do `ruff format`; textos longos ficam inteiros

[tool.ruff.lint.isort]
known-first-party = ["db", "export", "export_web", "metrics", "referencias", "transform", "extract", "load"]
