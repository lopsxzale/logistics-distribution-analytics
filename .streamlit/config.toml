[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2c2c2a"
baseRadius = "0.75rem"
showWidgetBorder = true
# Paleta validada para daltonismo no tema escuro (skill dataviz): ordem fixa, nunca reciclada.
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
chartSequentialColors = ["#0d366b", "#104281", "#184f95", "#1c5cab", "#256abf", "#2a78d6", "#3987e5", "#5598e7", "#86b6ef", "#cde2fb"]
chartDivergingColors = ["#1c5cab", "#2a78d6", "#5598e7", "#86b6ef", "#383835", "#383835", "#f0a5a5", "#e66767", "#d03b3b", "#a32525"]

[theme.sidebar]
backgroundColor = "#131312"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
